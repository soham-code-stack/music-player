<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wax &amp; Wire — Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

  <!-- LEFT: DECK -->
  <section class="deck" aria-label="Turntable display">
    <div class="brand">WAX &amp; WIRE <small>NO. 07</small></div>

    <div class="platter-wrap">
      <div class="platter" id="platter">
        <div class="label"><span id="labelText">SIDE A</span></div>
      </div>
      <div class="tonearm" id="tonearm" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle cx="100" cy="20" r="9" fill="#0c0a08" stroke="var(--copper)" stroke-width="2"/>
          <line x1="100" y1="20" x2="34" y2="86" stroke="var(--copper)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="34" cy="86" r="3.5" fill="var(--paper)"/>
        </svg>
      </div>
    </div>

    <p class="deck-caption" id="deckCaption">Paused</p>
  </section>

  <!-- RIGHT: CONSOLE -->
  <section class="console" aria-label="Player controls">

    <div class="now-playing">
      <p class="eyebrow">Now Playing</p>
      <h1 class="title" id="trackTitle">—</h1>
      <p class="artist" id="trackArtist">—</p>
    </div>

    <div class="progress-row">
      <span class="time" id="currentTime">0:00</span>
      <input type="range" id="progress" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <span class="time right" id="duration">0:00</span>
    </div>

    <div class="transport">
      <button class="btn-icon btn-toggle" id="shuffleBtn" title="Shuffle" aria-pressed="false" aria-label="Toggle shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>

      <button class="btn-icon" id="prevBtn" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="play-btn" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>

      <button class="btn-icon" id="nextBtn" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>

      <button class="btn-icon btn-toggle" id="repeatBtn" title="Repeat" aria-pressed="false" aria-label="Toggle repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div class="secondary-row">
      <div class="volume-group">
        <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
        <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume">
      </div>
      <div class="mode-group">
        <button class="btn-icon btn-toggle" id="autoplayBtn" aria-pressed="true" aria-label="Toggle autoplay" title="Autoplay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </button>
      </div>
    </div>

    <div class="playlist-header">
      <h2>Playlist</h2>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="playlist-count" id="playlistCount"></span>
        <button id="addSongsBtn">+ Add songs</button>
        <input type="file" id="fileInput" accept="audio/*" multiple style="display:none;">
      </div>
    </div>
    <ul class="playlist" id="playlist" role="listbox" aria-label="Track list"></ul>

  </section>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="songs.js"></script>
<script src="script.js"></script>
</body>
</html>
